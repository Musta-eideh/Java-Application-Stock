<div th:replace="shared/header"></div>
                <!-- Begin Page Content -->
                <div class="container-fluid">

                    <!-- Page Heading -->
                     <div class="title d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <h1 class="h3 mb-2 text-gray-800">Serviços</h1>
                            <p class="mb-0">Serviços realizados.</p>
                        </div>
                        
                        <a href="/servicos/novo">
                            <button type="button" 
                                    class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center" 
                                    style="width: 50px; height: 50px;">
                                +
                            </button>
                        </a>
                    </div>

                    <!-- DataTales Example -->
                    <div class="card shadow mb-4">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">Tabela de Serviços</h6>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                                    <thead>
                                        <tr>
                                            <th>Data</th>
                                            <th>Nome do Cliente</th>
                                            <th>Modelo da máquina</th>
                                            <th>Peça utilizada</th>
                                            <th>Quantidade</th>
                                            <th>Valor da peça</th>
                                            <th>Mão de obra</th>
                                            <th>Total</th>
                                        </tr>
                                    </thead>
                                    <tfoot>
                                        <tr>
                                            <th>Data</th>
                                            <th>Nome do Cliente</th>
                                            <th>Modelo da máquina</th>
                                            <th>Peça utilizada</th>
                                            <th>Quantidade</th>
                                            <th>Valor da peça</th>
                                            <th>Mão de obra</th>
                                            <th>Total</th>
                                        </tr>
                                    </tfoot>
                                    <tbody>
                                        <tr th:each="service : ${services}">
                                            <td th:text="${service.date}"></td>
                                            <td th:text="${service.nameClient}"></td>
                                            <td th:text="${service.machineModel}"></td>
                                            <td th:text="${service.partUsed}"></td>
                                            <td th:text="${service.amount}"></td>
                                            <td th:text="${service.valueOfThePiece}"></td>
                                            <td th:text="${service.labor}"></td>
                                            <td th:text="${service.totalService}"></td>
                                            <td><a href="#" class="btn btn-warning">Alterar</td>
                                            <td><a href="#" class="btn btn-danger">Excluir</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                </div>
                <!-- /.container-fluid -->
<div th:replace="shared/footer"></div>
