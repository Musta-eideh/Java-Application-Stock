<div th:replace="shared/header"></div>
                <!-- Begin Page Content -->
                <div class="container-fluid">

                    
                    <!-- Page Heading -->
                    <div class="title d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <h1 class="h3 mb-2 text-gray-800">Clientes</h1>
                            <p class="mb-0">Tabela de clientes cadastrados.</p>
                        </div>

                        <a href="/clientes/novo">
                            <button type="button" 
                                    class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center" 
                                    style="width: 50px; height: 50px;">
                                +
                            </button>
                        </a>
                    </div>

                    <!-- DataTales Example -->
                    <div class="card shadow mb-4">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">Tabela de Clientes</h6>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                                    <thead>
                                        <tr>
                                            <th>Nome</th>
                                            <th>Endereço</th>
                                            <th>Telefone</th>
                                            <th>Funcionário</th>
                                            <th>E-mail</th>
                                            <th>Máquinas</th>
                                        </tr>
                                    </thead>
                                    <tfoot>
                                        <tr>
                                            <th>Nome</th>
                                            <th>Endereço</th>
                                            <th>Telefone</th>
                                            <th>Funcionário</th>
                                            <th>E-mail</th>
                                            <th>Máquinas</th>
                                        </tr>
                                    </tfoot>
                                    <tbody>
                                        <tr th:each="client : ${clients}">
                                            <td th:text="${client.name}"></td>
                                            <td th:text="${client.address}"></td>
                                            <td th:text="${client.phone}"></td>
                                            <td th:text="${client.employee}"></td>
                                            <td th:text="${client.email}"></td>
                                            <td th:text="${client.machine}"></td>
                                            <td><a href="#" class="btn btn-warning">Alterar</td>
                                            <td><a href="#" class="btn btn-danger">Excluir</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                </div>
                <!-- /.container-fluid -->
<div th:replace="shared/footer"></div>
